name: Daily Motivational Short

on:
  schedule:
    # 6:30 AM IST (1:00 AM UTC) — morning prime time
    - cron: "0 1 * * *"
    # 9:30 PM IST (4:00 PM UTC) — night prime time
    - cron: "0 16 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          TIME_OF_DAY: ${{ github.event.schedule == '0 1 * * *' && 'morning' || github.event.schedule == '0 16 * * *' && 'evening' || 'evening' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          TOPIC_HINTS: ${{ secrets.TOPIC_HINTS }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python generate_and_upload_short.py

      - name: Commit content log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content_log.csv
          git diff --staged --quiet || git commit -m "Log content entry [skip ci]"
          git push
